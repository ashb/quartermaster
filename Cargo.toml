[workspace]
members = ["crates/qm-types", "crates/qm-providers", "crates/qm-macos", "crates/qm-broker", "crates/qm-api-github", "bins/quartermasterd"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
qm-types = { path = "crates/qm-types" }
rbw = { version = "=1.15.0", default-features = false }
zeroize = "1.8.2"
time = { version = "=0.3.55", features = ["serde"] }
