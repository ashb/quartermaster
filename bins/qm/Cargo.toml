[package]
name = "qm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.190"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.53", features = ["rt", "process", "signal", "time", "macros", "net"] }

[[bin]]
name = "qm"
path = "src/main.rs"
