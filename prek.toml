minimum_prek_version = "0.5.5"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "Rust formatting (Bazel toolchain)"
language = "system"
entry = "bazelisk run @rules_rust//:rustfmt -- //crates/... //bins/... -- --check"
pass_filenames = false
files = '\.rs$'

[[repos.hooks]]
id = "clippy"
name = "Clippy (Bazel targets)"
language = "system"
entry = "bazelisk build --aspects=@rules_rust//rust:defs.bzl%rust_clippy_aspect --output_groups=clippy_checks //crates/... //bins/..."
pass_filenames = false
files = '^(crates/|bins/|build/|Cargo\.(toml|lock)$|.*BUILD\.bazel$|MODULE\.bazel|\.bazelrc$|prek\.toml$)'

[[repos.hooks]]
id = "gazelle"
name = "Gazelle BUILD consistency"
language = "system"
entry = "bazelisk run //:gazelle_check"
pass_filenames = false
always_run = true
