[package]
name = "qm-api-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
apollo-parser = "=0.8.7"
http = "1"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hegel = { package = "hegeltest", version = "=0.50.3", features = ["static-engine"] }
