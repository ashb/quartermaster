[package]
name = "qm-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
qm-types.workspace = true
form_urlencoded = "=1.2.2"
httparse = "1.10.1"
libc = "0.2.190"
qm-providers = { path = "../qm-providers" }
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { workspace = true, features = ["serde"] }
time.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDistributedNotificationCenter", "NSError", "NSNotification", "NSObject", "NSRunLoop", "NSSet", "NSString", "NSXPCConnection", "block2", "libc"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext"] }
qm-macos = { path = "../qm-macos" }
tokio = { version = "1.53", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10.1"
security-framework-sys = { version = "2.15", features = ["OSX_10_15"] }

[build-dependencies]
cc = "=1.8.0"
