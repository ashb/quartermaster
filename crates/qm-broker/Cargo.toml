[package]
name = "qm-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
form_urlencoded = "=1.2.2"
httparse = "1.10.1"
libc = "0.2.190"
qm-providers = { path = "../qm-providers" }
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { workspace = true, features = ["serde"] }
time.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
qm-macos = { path = "../qm-macos" }
tokio = { version = "1.53", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rama-net-apple-xpc = "=0.4.0"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "=1.8.0"
